@if (photos().length === 0) {
  <div class="text-center py-10 text-gray-500">
    Không có bức ảnh nào cần duyệt
  </div>
} @else {
  <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
    @for (photo of photos(); track photo.id) {
      <div class="card bg-base-100 shadow-md border border-base-200">
        <figure class="px-2 pt-2">
          <img 
            [src]="photo.url" 
            alt="Photo to moderate" 
            class="rounded-xl h-48 w-full object-cover" 
          />
        </figure>
        <div class="card-body p-3 items-center text-center">
          <p class="text-sm font-semibold truncate w-full">{{ photo.displayName }}</p>
          <div class="card-actions justify-center gap-2 mt-2 w-full">
            <button 
              class="btn btn-sm btn-error flex-1" 
              (click)="rejectPhoto(photo.id)">
              Xóa
            </button>
            <button 
              class="btn btn-sm btn-success flex-1" 
              (click)="approvePhoto(photo.id)">
              Duyệt
            </button>
          </div>
        </div>
      </div>
    }
  </div>
}
